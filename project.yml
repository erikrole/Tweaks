name: Tweaks
options:
  bundleIdPrefix: com.erole
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    TWEAKS_SOURCE_REVISION: local-development
packages:
  FinderUtilitiesKit:
    path: Packages/FinderUtilitiesKit
targets:
  Tweaks:
    type: application
    platform: macOS
    sources:
      - Tweaks
    dependencies:
      - package: FinderUtilitiesKit
      - target: TweaksFinderSync
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.Tweaks
        PRODUCT_NAME: Tweaks
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tweaks/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEVELOPMENT_TEAM: T26T3G8C7Q
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - TweaksTests
  TweaksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TweaksTests
    dependencies:
      - target: Tweaks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.TweaksTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: T26T3G8C7Q
  TweaksMedia:
    type: bundle
    platform: macOS
    sources:
      - MediaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.Tweaks.MediaReader
        PRODUCT_NAME: TweaksMedia
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: TweaksMediaReader
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: T26T3G8C7Q
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
  TweaksFinderSync:
    type: app-extension
    platform: macOS
    sources: [FinderSync]
    dependencies:
      - package: FinderUtilitiesKit
      - target: TweaksMedia
    postBuildScripts:
      - name: Copy media reader into the extension
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="${BUILT_PRODUCTS_DIR}/TweaksMedia.bundle"
          dest="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/TweaksMedia.bundle"
          if [[ ! -d "$src" ]]; then
            echo "error: TweaksMedia.bundle was not built at $src" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          cp -RL "$src" "$dest"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" && "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "$dest"
          fi
    info:
      path: FinderSync/Info.plist
      properties:
        CFBundleDisplayName: Finder Utilities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.Tweaks.FinderSync
        PRODUCT_NAME: TweaksFinderSync
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: T26T3G8C7Q
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
